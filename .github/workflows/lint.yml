name: Validación

on:
  pull_request:

permissions:
  contents: read

jobs:
  estandares-php:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            wordpress: "6.6"
            composer_mode: minimum
          - php: "8.4"
            wordpress: "6.9"
            composer_mode: locked

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_TABLE_PREFIX: wptests_vicu_restaurante_

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar PHP y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias fijadas
        if: matrix.composer_mode == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Resolver WordPress mínimo compatible
        if: matrix.composer_mode == 'minimum'
        run: >-
          composer update
          johnpbloch/wordpress-core
          wp-phpunit/wp-phpunit
          --with-all-dependencies
          --prefer-lowest
          --no-interaction
          --no-progress

      - name: Validar PHP
        run: composer check

  bloques:
    name: Node.js, bloques y build versionado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias de bloques
        run: npm ci

      - name: Validar bloques
        run: npm run check

      - name: Comprobar build versionado
        run: git diff --exit-code -- build
